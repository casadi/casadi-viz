name: Build, test and package
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          npm run dev > /tmp/casadi-viz-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8766/examples/bundles.html >/dev/null && break
            sleep 1
          done
          npm run test:browser
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: casadi-viz-package
          path: '*.tgz'
  publish:
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: casadi-viz-package
          path: package
      - name: Publish the tested CI artifact
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          npm_tag=latest
          if [ "$PRERELEASE" = true ]; then npm_tag=next; fi
          npm publish ./package/*.tgz --access public --provenance --ignore-scripts --tag "$npm_tag"
