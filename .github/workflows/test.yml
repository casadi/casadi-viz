name: Package and browser tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          npm run dev > /tmp/casadi-viz-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8766/examples/bundles.html >/dev/null && break
            sleep 1
          done
          npm run test:browser
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: casadi-viz-package
          path: '*.tgz'
